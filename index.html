<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Address Hub" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Address Hub Demo | Address Management System</title>
    <meta name="description" content="High-performance Address Management System Demo with instant search, multi-field filtering, and analytics." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Mukta+Malar:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #100b09; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 1.25rem;">
        <!-- Funny mascot -->
        <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #ea580c, #f97316); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(234, 88, 12, 0.4); animation: splashMascot 1.8s ease-in-out infinite;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>

        <!-- Funny Bouncing Dot Wave -->
        <div style="display: flex; align-items: flex-end; gap: 10px; height: 50px;">
          <div class="s-dot s-d1" style="background:#ea580c;">^‿^</div>
          <div class="s-dot s-d2" style="background:#f97316;">◕‿◕</div>
          <div class="s-dot s-d3" style="background:#10b981;">•‿•</div>
          <div class="s-dot s-d4" style="background:#f59e0b;">★‿★</div>
          <div class="s-dot s-d5" style="background:#fb923c;">^o^</div>
        </div>

        <div style="text-align: center;">
          <div style="font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">AddressHub Demo</div>
          <div style="font-size: 0.8rem; color: #fed7aa; margin-top: 0.25rem;">Loading Demo Experience... ✨</div>
        </div>
        <style>
          @keyframes splashMascot { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(5deg) scale(1.08); } }
          @keyframes splashJelly { 0%, 100% { transform: translateY(0) scale(1.3, 0.7); } 35% { transform: translateY(-26px) scale(0.85, 1.25) rotate(-3deg); } 50% { transform: translateY(-30px) scale(1, 1) rotate(4deg); } 85% { transform: translateY(-2px) scale(1.1, 0.9); } }
          .s-dot { width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 7px; font-weight: 800; display: flex; align-items: center; justify-content: center; transform-origin: bottom center; }
          .s-d1 { animation: splashJelly 1.4s ease-in-out infinite 0s; }
          .s-d2 { animation: splashJelly 1.4s ease-in-out infinite 0.16s; }
          .s-d3 { animation: splashJelly 1.4s ease-in-out infinite 0.32s; }
          .s-d4 { animation: splashJelly 1.4s ease-in-out infinite 0.48s; }
          .s-d5 { animation: splashJelly 1.4s ease-in-out infinite 0.64s; }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
